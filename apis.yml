aid: advanced-aircraft-company
name: Advanced Aircraft Company
description: Advanced Aircraft Company (AAC) is a veteran-owned aerospace manufacturer in Hampton, Virginia,
  founded in 2017 to build long-endurance hybrid fuel-electric VTOL unmanned aircraft systems for commercial,
  public-safety and defense missions. Its flagship HAMR (Hybrid Advanced Multi-Rotor) UAS flies 3.5+ hours
  on gas-electric propulsion, and its Greased Lightning tilt-wing is built on technology licensed from
  NASA Langley Research Center. AAC is a hardware company with no developer program and no product API;
  its only public machine-readable surface is the WordPress REST API and an OAuth-gated WordPress MCP
  Adapter server exposed by its own marketing site.
