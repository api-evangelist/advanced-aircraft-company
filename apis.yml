apis:
- aid: advanced-aircraft-company:advanced-aircraft-company-site-content-api
  name: Advanced Aircraft Company Site Content API
  description: The public WordPress REST API served from the Advanced Aircraft Company corporate site
    at https://advancedaircraftcompany.com/wp-json. The self-describing route index advertises 647 routes
    across 46 namespaces; the anonymously readable portion is the WordPress core wp/v2 content namespace
    (posts, pages, media, categories, types) plus oembed/1.0. This is platform-provided surface from WordPress
    core and installed plugins (All in One SEO, Jetpack, Newfold/Bluehost, WPForms, Redirection, WP Rocket,
    Google Site Kit) rather than a product API AAC authored, and AAC publishes no developer documentation
    for it. Recorded here because it is a real, first-party-hosted, machine-readable API surface on the
    company's own domain.
  humanURL: https://advancedaircraftcompany.com/wp-json
