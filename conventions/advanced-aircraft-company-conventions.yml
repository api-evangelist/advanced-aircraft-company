idempotency:
  supported: false
  coverage: none
  mechanism: null
  header: null
  scope: []
  note: >-
    No Idempotency-Key header, no client-supplied request token, and no replay-protection mechanism
    anywhere on the surface. WordPress REST has no idempotency facility, and AAC has added none. A
    repeated POST to a create route produces a duplicate record. Recorded as coverage: none rather
    than na because a real mutating surface exists (POST/PUT/PATCH/DELETE on wp/v2 and the plugin
    namespaces) — it simply has no replay protection.
reversibility:
  grade: documented
  applies_to: WordPress core content deletes (wp/v2 posts, pages, media, comments, blocks, templates)
  write_surfaces:
  - operation: DELETE /wp-json/wp/v2/posts/{id}
    reversal: >-
      Soft delete by default. The `force` argument is a boolean with default false and the schema
      description "Whether to bypass Trash and force deletion." A default delete moves the record to
      Trash (status=trash), from which it is restorable by writing `status` back via
      POST/PUT/PATCH /wp-json/wp/v2/posts/{id}.
    window: null
    window_note: >-
      NO RETENTION WINDOW IS STATED. WordPress purges Trash on a schedule governed by the site's
      EMPTY_TRASH_DAYS constant, which is server-side configuration and is not exposed anywhere in the
      discovery document or in any AAC-published page. The window is therefore unknown and is not
      asserted here.
    irreversible_variant: DELETE ...?force=true — permanent, no reversal path.
    evidence: https://advancedaircraftcompany.com/wp-json
  - operation: DELETE /wp-json/wp/v2/pages/{id}
    reversal: Identical soft-delete/Trash semantics; `force` defaults to false.
    window: null
    evidence: https://advancedaircraftcompany.com/wp-json
  grade_reason: >-
    A reversal path exists and is machine-readable from the schema, but no reversal window is stated
    by the provider anywhere, so this grades `documented` rather than `verified`.
  note: >-
    The anonymously reachable surface is read-only (Allow: GET on the wp/v2 collections), so an
    unauthenticated agent has nothing to reverse. Reversibility only becomes relevant once an
    Application Password is issued by a site administrator.
