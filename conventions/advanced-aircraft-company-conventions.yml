name: Advanced Aircraft Company API Conventions
description: >-
  Cross-cutting runtime semantics of the only API surface Advanced Aircraft Company serves. AAC
  publishes no developer documentation, so every statement below is read from the machine-readable
  route schema its host serves or observed directly on a live unauthenticated response. The semantics
  are WordPress REST API conventions, inherited from the platform rather than designed by AAC.
auth_style:
  summary: >-
    Anonymous for the wp/v2 read surface; WordPress Application Passwords (HTTP Basic) for writes and
    plugin routes; OAuth 2.1 + PKCE for the MCP endpoint only.
  see: authentication/advanced-aircraft-company-authentication.yml
versioning:
  style: path-namespace
  pattern: /wp-json/<namespace>/<version>
  current: wp/v2
  note: >-
    Version lives in the namespace segment. 46 namespaces are advertised, each versioning
    independently (wp/v2, aioseo/v1, jetpack/v4, newfold-ctb/v2, ...). No Accept-header or query
    versioning. No version negotiation is documented.
pagination:
  style: page-number
  request_params:
  - name: page
    type: integer
    default: 1
    minimum: 1
  - name: per_page
    type: integer
    default: 10
    minimum: 1
    maximum: 100
  - name: offset
    type: integer
  - name: order
    type: string
    default: desc
  - name: orderby
    type: string
    default: date
  response_headers:
  - name: X-WP-Total
    description: Total number of matching records.
    observed: '29'
  - name: X-WP-TotalPages
    description: Total number of pages at the current per_page.
    observed: '29'
  - name: Link
    description: RFC 8288 link relations. rel="next" and rel="prev" carry the paged URLs.
    observed: '<https://advancedaircraftcompany.com/wp-json/wp/v2/posts?per_page=1&page=2>; rel="next"'
  note: >-
    The paging headers are explicitly CORS-exposed (access-control-expose-headers: X-WP-Total,
    X-WP-TotalPages, Link), so a browser client can read them.
sparse_fields:
  supported: true
