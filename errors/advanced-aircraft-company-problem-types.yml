name: Advanced Aircraft Company Error Catalog
description: >-
  Advanced Aircraft Company publishes no error reference. Every entry below was observed on a live
  response from its own host; none is inferred. The surface uses the WordPress REST error envelope,
  not RFC 9457 — no application/problem+json is served anywhere.
format: wordpress-rest
rfc9457: false
content_type: application/json; charset=UTF-8
envelope:
  code: Machine-readable error slug.
  message: Human-readable sentence, not localized per-request.
  data.status: HTTP status, duplicated inside the body.
error_count: 5
errors:
- code: rest_forbidden
  status: 401
  message: Sorry, you are not allowed to do that.
  meaning: >-
    The route requires an authenticated WordPress user and no valid Application Password was
    presented. Note the mismatch: the slug says "forbidden" but the status is 401, not 403.
  remediation: >-
    Obtain an Application Password from a site administrator via
    /wp-admin/authorize-application.php and send it as HTTP Basic credentials.
  observed_on:
  - https://advancedaircraftcompany.com/wp-json/wp-abilities/v1/abilities
  - https://advancedaircraftcompany.com/wp-json/mcp/mcp-adapter-default-server
  - https://advancedaircraftcompany.com/wp-json/blu/mcp
- code: mcp_unauthorized
  status: 401
  message: MCP authentication required.
  meaning: >-
    The MCP OAuth server rejected an unauthenticated JSON-RPC call. Distinct from rest_forbidden —
    this endpoint expects an OAuth bearer token, not an Application Password.
  remediation: >-
    Complete the authorization-code + PKCE flow described in
    /.well-known/oauth-authorization-server and present the token as a bearer header.
  observed_on:
  - https://advancedaircraftcompany.com/wp-json/mcp/mcp-oauth-server
- code: rest_no_route
  status: 404
  message: No route was found matching the URL and request method.
  meaning: The requested path is not registered in any namespace.
  remediation: Read the route index at /wp-json and use a registered path and method.
  observed_on:
  - https://advancedaircraftcompany.com/wp-json/graphql
- code: rest_missing_callback_param
  status: 400
  message: 'Missing parameter(s): url'
  meaning: >-
    A required parameter was absent. This envelope carries an extra `data.params` array naming the
    missing parameters, which the other error shapes do not.
  remediation: Supply every parameter named in data.params.
  observed_on:
  - https://advancedaircraftcompany.com/wp-json/oembed/1.0/embed
- code: modsecurity_not_acceptable
  status: 406
  message: Not Acceptable! ... This error was generated by Mod_Security.
  meaning: >-
    NOT a WordPress error and NOT JSON — an HTML block page emitted by the ModSecurity WAF in front of
    the site. Triggered by User-Agent shape, not by the route: a truncated `Mozilla/5.0` UA is
    406-blocked on a route that returns 200 for both a full browser UA and curl's own default UA.
  remediation: >-
    Send either a complete, realistic browser User-Agent or an honest client UA. A partial
    browser-lookalike string is what trips the rule.
  agent_impact: >-
    An agent or crawler sending an abbreviated browser UA will see 406 HTML on every path and could
    wrongly conclude the API does not exist. This is an edge policy, not an absent surface.
  observed_on:
  - https://advancedaircraftcompany.com/wp-json/wp/v2/posts?per_page=1
notes:
- >-
  Non-API 404s on the site root (e.g. /openapi.json, /docs) return the Avada WordPress HTML theme
  shell with a 404 status, not JSON. Only /wp-json/* paths produce the structured envelope above.
- >-
  No error catalog, status-code table, or troubleshooting page exists on advancedaircraftcompany.com;
  the sitemap contains only marketing pages and news posts.
